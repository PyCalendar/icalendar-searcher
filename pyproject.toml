[build-system]
requires = [
    "hatchling>=1.27.0",
    "hatch-vcs",
    # raw-options.scm (the describe_command below) needs setuptools-scm 9
    "setuptools-scm>=9",
]
build-backend = "hatchling.build"

[project]
name = "icalendar-searcher"
dynamic = ["version"]
description = "Search, filter and sort iCalendar components"
readme = "README.md"
## The recurring-ical-events >=3.8.0 dependency transitively requires
## click >=8.3.1 (via x-wr-timezone) which only supports Python >=3.10.
## The caldav library's own CI still exercises this library with Python 3.9.
requires-python = ">=3.10,<4.0"
license = "GPL-3.0-or-later OR Apache-2.0"
license-files = ["COPYING.GPL", "COPYING.APACHE"]
authors = [{ name = "Tobias Brox", email = "tobias@redpill-linpro.com" }]
dependencies = [
    "icalendar>=6.2.0",
    "recurring-ical-events>=3.8.0",
]

[project.optional-dependencies]
collation = ["PyICU"]
dev = [
    "ruff",
    "pre-commit",
    "pytest>=8.0.0,<10.0.0",
    "PyICU",
    "deptry>=0.24.0",
]

[project.urls]
Repository = "https://github.com/pycalendar/icalendar-searcher"
Issues = "https://github.com/pycalendar/icalendar-searcher/issues"

[tool.hatch.version]
source = "vcs"
# Only v<digit>* tags are releases. The default describe matches any tag
# containing a digit, so a date-stamped local tag on HEAD (a pre-rewrite
# backup, say) became the version and broke every build.
raw-options = { scm = { git = { describe_command = "git describe --dirty --tags --long --abbrev=40 --match v[0-9]*" } } }

[tool.hatch.build.hooks.vcs]
version-file = "src/icalendar_searcher/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/icalendar_searcher"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["icalendar_searcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry.per_rule_ignores]
DEP004 = ["icu"]  # PyICU is optional (collation extra), also in dev for testing
DEP002 = ["ruff", "pre-commit", "pytest", "deptry"]  # dev tools, not imported in source
